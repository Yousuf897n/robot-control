<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Dashboard - Custom ID</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        .dashboard { border: 2px solid #00f2ff; border-radius: 20px; padding: 20px; box-shadow: 0 0 20px #00f2ff; max-width: 400px; margin: auto; background: rgba(0, 10, 20, 0.9); }
        h3 { font-size: 14px; text-shadow: 0 0 8px #00f2ff; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        video { width: 100%; border-radius: 10px; border: 1px solid #00f2ff; background: #050505; }
        .id-display { background: rgba(255, 140, 0, 0.1); padding: 10px; border: 1px dashed #ff8c00; color: #ff8c00; font-weight: bold; margin-bottom: 15px; }
        input { background: transparent; border: 1px solid #00f2ff; color: white; padding: 8px; width: 70%; margin-bottom: 10px; outline: none; }
        button { background: transparent; border: 1px solid #00f2ff; color: #00f2ff; padding: 8px 20px; cursor: pointer; transition: 0.3s; font-size: 12px; }
        button:hover { background: #00f2ff; color: #000; box-shadow: 0 0 10px #00f2ff; }
        #chat-window { height: 100px; overflow-y: auto; background: #000; border: 1px solid #333; margin: 15px 0; padding: 10px; text-align: left; font-size: 11px; }
        .active { border-color: #00ff00 !important; color: #00ff00 !important; box-shadow: 0 0 10px #00ff00; }
    </style>
</head>
<body>

<div class="dashboard">
    <h3>● SHARK SYSTEM: SECURE CONNECTION</h3>
    
    <div class="video-grid">
        <video id="localVideo" autoplay playsinline muted title="Your Feed"></video>
        <video id="remoteVideo" autoplay playsinline title="Friend's Feed"></video>
    </div>

    <div class="id-display">
        آپ کا سسٹم نام: <span id="display-id">Connecting...</span>
    </div>

    <input type="text" id="target-id" placeholder="دوست کا نام یہاں لکھیں...">
    <br>
    <button onclick="startCall()">CONNECT LIVE</button>

    <div id="chat-window">SYSTEM: Awaiting encrypted data...</div>
    
    <div style="display:flex; gap:5px;">
        <input type="text" id="msg-text" placeholder="Type message..." style="width: 100%;">
        <button onclick="sendMsg()">SEND</button>
    </div>

    <button id="mic-toggle" onclick="toggleMic()" style="width:100%; margin-top:10px; border-color:#ff4444; color:#ff4444;">MIC: OFF</button>
    
    <div style="font-size: 9px; margin-top: 15px; opacity: 0.5;">ENCRYPTION: AES-256 | BY: MY</div>
</div>

<script>
    // 1. User سے نام پوچھنا
    const myName = prompt("اپنا ایک منفرد نام لکھیں (مثلاً: yousuf123):") || "user" + Math.floor(Math.random()*1000);
    const peer = new Peer(myName); 

    let localStream;
    let currentConn;

    // 2. ID سیٹ کرنا
    peer.on('open', (id) => {
        document.getElementById('display-id').innerText = id;
    });

    // 3. میڈیا (کیمرہ + مائیک) شروع کرنا
    async function startMedia() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
        } catch (e) { alert("Access Denied: " + e); }
    }
    startMedia();

    // 4. آنے والی کال وصول کرنا
    peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (stream) => {
            document.getElementById('remoteVideo').srcObject = stream;
        });
    });

    peer.on('connection', (conn) => {
        currentConn = conn;
        listenForMsgs();
    });

    // 5. کال کرنا
    function startCall() {
        const destId = document.getElementById('target-id').value;
        const call = peer.call(destId, localStream);
        call.on('stream', (stream) => {
            document.getElementById('remoteVideo').srcObject = stream;
        });
        currentConn = peer.connect(destId);
        listenForMsgs();
    }

    // 6. چیٹ لاجک
    function listenForMsgs() {
        currentConn.on('data', (data) => {
            document.getElementById('chat-window').innerHTML += `<div style="color:#ff8c00;">> Incoming: ${data}</div>`;
        });
    }

    function sendMsg() {
        const txt = document.getElementById('msg-text').value;
        if(currentConn && txt) {
            currentConn.send(txt);
            document.getElementById('chat-window').innerHTML += `<div>> You: ${txt}</div>`;
            document.getElementById('msg-text').value = '';
        }
    }

    // 7. مائیک لاجک
    function toggleMic() {
        const audio = localStream.getAudioTracks()[0];
        audio.enabled = !audio.enabled;
        const btn = document.getElementById('mic-toggle');
        btn.innerText = audio.enabled ? "MIC: ACTIVE" : "MIC: OFF";
        btn.classList.toggle('active');
    }
</script>

</body>
</html>
