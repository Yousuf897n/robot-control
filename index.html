<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Dashboard - WebRTC Live</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #00f2ff; font-family: monospace; text-align: center; margin: 0; padding: 20px; }
        .dashboard { border: 2px solid #00f2ff; border-radius: 15px; padding: 15px; box-shadow: 0 0 15px #00f2ff; max-width: 400px; margin: auto; }
        video { width: 100%; border-radius: 10px; border: 1px solid #00f2ff; background: #111; margin-bottom: 10px; }
        .id-box { background: rgba(0,242,255,0.1); padding: 10px; margin: 10px 0; border: 1px dashed #ff8c00; font-size: 12px; }
        input { background: transparent; border: 1px solid #ff8c00; color: white; padding: 5px; width: 60%; margin-bottom: 5px; }
        button { background: transparent; border: 1px solid #00f2ff; color: #00f2ff; padding: 8px 15px; cursor: pointer; margin: 5px; }
        #chat-box { height: 80px; overflow-y: auto; background: #050505; border: 1px solid #00f2ff; margin: 10px 0; font-size: 11px; text-align: left; padding: 5px; }
        .active { border-color: #00ff00 !important; color: #00ff00 !important; }
    </style>
</head>
<body>

<div class="dashboard">
    <h3>● SHARK COMMS HUB [WebRTC]</h3>
    
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="remoteVideo" autoplay playsinline></video>

    <div class="id-box">
        آپ کی آئی ڈی: <span id="my-id" style="color:#ff8c00; font-weight:bold;">Loading...</span>
    </div>

    <input type="text" id="peer-id-input" placeholder="دوست کی آئی ڈی یہاں لکھیں...">
    <button onclick="connectToPeer()">CONNECT LIVE</button>

    <div id="chat-box">SYSTEM: Waiting for connection...</div>
    
    <div style="display:flex; gap:5px;">
        <input type="text" id="msg-input" placeholder="Type message...">
        <button onclick="sendText()">SEND</button>
    </div>

    <button id="mic-btn" onclick="toggleMic()">MIC: OFF</button>
    <div style="font-size: 10px; margin-top: 10px;">BY: MY</div>
</div>

<script>
    const peer = new Peer(); 
    let myStream;
    let conn;

    // اپنی آئی ڈی حاصل کریں
    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
    });

    // کیمرہ اور مائیک شروع کریں
    async function init() {
        myStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = myStream;
    }
    init();

    // آنے والی کال کا جواب دیں
    peer.on('call', (call) => {
        call.answer(myStream);
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
    });

    // دوسرے بندے سے جڑیں
    function connectToPeer() {
        const peerId = document.getElementById('peer-id-input').value;
        const call = peer.call(peerId, myStream);
        
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
            document.getElementById('chat-box').innerHTML += "<div>SYSTEM: Connected!</div>";
        });

        conn = peer.connect(peerId);
        setupChat();
    }

    // چیٹ وصول کرنا
    peer.on('connection', (c) => {
        conn = c;
        setupChat();
    });

    function setupChat() {
        conn.on('data', (data) => {
            document.getElementById('chat-box').innerHTML += `<div style="color:#ff8c00">> Friend: ${data}</div>`;
        });
    }

    function sendText() {
        const msg = document.getElementById('msg-input').value;
        conn.send(msg);
        document.getElementById('chat-box').innerHTML += `<div>> You: ${msg}</div>`;
        document.getElementById('msg-input').value = '';
    }

    function toggleMic() {
        const audioTrack = myStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;
        const btn = document.getElementById('mic-btn');
        btn.innerText = audioTrack.enabled ? "MIC: ACTIVE" : "MIC: OFF";
        btn.classList.toggle('active');
    }
</script>

</body>
</html>
