<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Dashboard - Pro Edition</title>
    <style>
        body {
            background-color: #000;
            color: #00f2ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .dashboard {
            width: 350px;
            padding: 20px;
            border: 3px solid #00f2ff;
            border-radius: 20px;
            box-shadow: 0 0 20px #00f2ff;
            text-align: center;
            background: rgba(0, 5, 10, 0.9);
        }

        h3 { font-size: 14px; margin-bottom: 10px; text-shadow: 0 0 5px #00f2ff; }

        /* Camera Feed */
        #video-container {
            width: 100%;
            height: 200px;
            background: #111;
            border-radius: 10px;
            border: 1px solid #00f2ff;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .live-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ff4444;
            font-weight: bold;
            font-size: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Depth Monitor */
        .depth-box {
            border: 1px solid #ff8c00;
            padding: 10px;
            margin-bottom: 15px;
            position: relative;
            height: 40px;
        }

        #depth-line {
            width: 100%;
            height: 2px;
            background: #ff8c00;
            position: absolute;
            top: 50%;
            left: 0;
            box-shadow: 0 0 10px #ff8c00;
            transition: 0.3s;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 15px;
        }

        button {
            background: transparent;
            border: 1px solid #00f2ff;
            color: #00f2ff;
            padding: 8px;
            cursor: pointer;
            font-size: 10px;
            transition: 0.3s;
        }

        button:active { background: #00f2ff; color: #000; }

        /* Chat & Voice Section */
        .comm-panel {
            border-top: 1px solid #00f2ff;
            padding-top: 10px;
        }

        #chat-display {
            height: 60px;
            background: rgba(0, 242, 255, 0.05);
            overflow-y: auto;
            margin-bottom: 5px;
            font-size: 10px;
            text-align: left;
            padding: 5px;
        }

        .input-group { display: flex; gap: 5px; }

        input {
            flex: 1;
            background: transparent;
            border: 1px solid #ff8c00;
            color: #fff;
            padding: 5px;
            font-size: 10px;
        }

        #mic-btn {
            width: 100%;
            margin-top: 8px;
            border-color: #ff4444;
            color: #ff4444;
        }

        .mic-active { border-color: #00ff00 !important; color: #00ff00 !important; box-shadow: 0 0 10px #00ff00; }

        .footer { font-size: 8px; margin-top: 10px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="dashboard">
    <h3>● LIVE SYSTEM FEED [ENCRYPTED]</h3>
    
    <div id="video-container" onclick="startCamera()">
        <span class="live-tag">● LIVE [ROBOT_EYE_01]</span>
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="depth-box">
        <div id="depth-line"></div>
        <span style="position:absolute; right:10px; top:10px; color:#ff8c00;">30m</span>
    </div>

    <div class="controls">
        <button onclick="moveDepth(-5)">RISE ▲</button>
        <button>FWD ↑</button>
        <button>STOP ■</button>
        <button>LEFT ◀</button>
        <button onclick="moveDepth(5)">DIVE ▼</button>
        <button>RIGHT ▶</button>
    </div>

    <div class="comm-panel">
        <div id="chat-display">SYSTEM: Ready for input...</div>
        <div class="input-group">
            <input type="text" id="chat-input" placeholder="Type message...">
            <button onclick="sendMessage()">SEND</button>
        </div>
        <button id="mic-btn" onclick="toggleMic()">MIC: OFF</button>
    </div>

    <div class="footer">SIGNAL: STABLE | BY: MY</div>
</div>

<script>
    let depth = 50;
    const webcam = document.getElementById('webcam');
    const micBtn = document.getElementById('mic-btn');

    // 1. Camera Logic
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            webcam.srcObject = stream;
        } catch (err) {
            alert("Camera Error: " + err);
        }
    }

    // 2. Depth Logic
    function moveDepth(val) {
        depth += val;
        document.getElementById('depth-line').style.top = depth + '%';
        if (navigator.vibrate) navigator.vibrate(50);
    }

    // 3. Chat Logic
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const display = document.getElementById('chat-display');
        if(input.value) {
            display.innerHTML += `<div>> ${input.value}</div>`;
            display.scrollTop = display.scrollHeight;
            input.value = '';
        }
    }

    // 4. Voice Logic
    let isMicOn = false;
    async function toggleMic() {
        if (!isMicOn) {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                micBtn.innerText = "MIC: ACTIVE";
                micBtn.classList.add('mic-active');
                isMicOn = true;
            } catch (err) {
                alert("Mic Access Denied");
            }
        } else {
            micBtn.innerText = "MIC: OFF";
            micBtn.classList.remove('mic-active');
            isMicOn = false;
        }
    }
</script>

</body>
</html>
